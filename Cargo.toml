[package]
name = "rnet-pi-server"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "openrnet_rs",
]

[dependencies]
openrnet = { path = "openrnet_rs" }
tokio = { version = "1.53.2", features = ["time", "rt-multi-thread", "macros"] }
thiserror = "2.0.21"
bluer = {version = "0.17.4", features = ["full"]}
uuid = { version = "1", features = ["v4"] }
